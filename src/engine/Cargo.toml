[package]
name = "aether-engine"
version.workspace = true
edition.workspace = true

[dependencies]
aether-core = { version = "0.1.0", path = "../core" }
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
cpal = "0.18.2"
dotenvy = "0.15.7"
futures-util = "0.3.34"
mavlink = { version = "0.21.0", default-features = false, features = ["std", "transport-udp", "dialect-common"] }
native-tls = "0.2.18"
pathfinding = "4.16.0"
postgres-native-tls = "0.5.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "native-tls", "multipart"] }
rodio = { version = "0.23.0", default-features = false, features = ["playback"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-postgres = "0.7.18"
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
